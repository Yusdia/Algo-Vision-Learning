<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Neon Green Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle with border -->
  <circle cx="64" cy="64" r="60" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="3" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4" />

  <!-- Candlesticks drawing behind the cap -->
  <g opacity="0.8">
    <!-- Bearish body (red-ish gray / dark) near left -->
    <rect x="36" y="58" width="6" height="20" rx="1.5" fill="#ef4444" opacity="0.6" />
    <line x1="39" y1="50" x2="39" y2="84" stroke="#ef4444" stroke-width="1.5" opacity="0.6" />
    
    <!-- Bullish body (green) near right center -->
    <rect x="52" y="44" width="6" height="28" rx="1.5" fill="url(#neon-grad)" />
    <line x1="55" y1="36" x2="55" y2="78" stroke="#10b981" stroke-width="1.5" />
    
    <!-- Bold Bullish body (green) far right -->
    <rect x="84" y="32" width="6" height="18" rx="1.5" fill="url(#neon-grad)" filter="url(#glow)" />
    <line x1="87" y1="24" x2="87" y2="56" stroke="#34d399" stroke-width="1.5" />
  </g>

  <!-- Glowing Trend Arrow pointing up and right -->
  <path d="M 32 82 L 55 64 L 72 74 L 102 38" fill="none" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 88 38 L 102 38 L 102 52" fill="none" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Graduation Cap Silhouette in Center/Right -->
  <g transform="translate(10, 5)">
    <!-- Cap Diamond -->
    <polygon points="54,34 84,45 54,56 24,45" fill="#1e293b" stroke="#e2e8f0" stroke-width="2" stroke-linejoin="round" />
    <polygon points="54,36 80,45 54,54 28,45" fill="#0f172a" />
    
    <!-- Cap Skull/Base -->
    <path d="M 37,49.5 L 37,58 C 37,63 71,63 71,58 L 71,49.5" fill="#1e293b" stroke="#e2e8f0" stroke-width="2" stroke-linejoin="round" />
    <path d="M 39,50 L 39,57 C 39,61 69,61 69,57 L 69,50" fill="#0f172a" />
    
    <!-- Tassel -->
    <path d="M 54,45 L 28,49 L 26,62" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="26" cy="62" r="2.5" fill="#fbbf24" />
  </g>
</svg>
