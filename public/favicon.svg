<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Accent Emerald Gradient (Bull/Growth) -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    
    <!-- Violet Gradient for educational depth -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Smooth Rounded Card background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#1e293b" stroke-width="8" opacity="0.5" />

  <!-- Abstract Grid Lines (Financial Background) -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="2">
    <line x1="96" y1="96" x2="96" y2="416" />
    <line x1="208" y1="96" x2="208" y2="416" />
    <line x1="320" y1="96" x2="320" y2="416" />
    <line x1="416" y1="96" x2="416" y2="416" />
    
    <line x1="96" y1="96" x2="416" y2="96" />
    <line x1="96" y1="208" x2="416" y2="208" />
    <line x1="96" y1="320" x2="416" y2="320" />
    <line x1="96" y1="416" x2="416" y2="416" />
  </g>

  <!-- Decorative Graduation Cap outline on background left-top -->
  <path d="M120 180 L200 150 L280 180 L200 210 Z" fill="none" stroke="url(#indigoGrad)" stroke-width="4" opacity="0.3" />
  <path d="M160 195 L160 230 C160 250, 240 250, 240 230 L240 195" fill="none" stroke="url(#indigoGrad)" stroke-width="4" opacity="0.3" />

  <!-- Candlesticks (Financial Simulator Concept) -->
  <!-- Candle 1 (Left - Indigo) -->
  <g opacity="0.4">
    <line x1="180" y1="260" x2="180" y2="380" stroke="#6366f1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="160" y="280" width="40" height="70" rx="6" fill="#4f46e5" />
  </g>

  <!-- Candle 2 (Middle - Emerald/Bullish) -->
  <g opacity="0.8">
    <line x1="280" y1="180" x2="280" y2="340" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="255" y="210" width="50" height="90" rx="8" fill="url(#emeraldGrad)" />
  </g>

  <!-- Candle 3 (Right - Big Breakout Emerald with Glow) -->
  <g filter="url(#glow)">
    <line x1="390" y1="110" x2="390" y2="270" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="360" y="140" width="60" height="100" rx="12" fill="url(#emeraldGrad)" />
  </g>

  <!-- Sleek Trend Line curving up to represent smart growth/profits (Bull Market path) -->
  <path d="M100 390 Q180 340, 280 250 T440 120" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Sleek Arrowhead of the trend line -->
  <path d="M410 115 L445 115 L445 150" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing core star / Sparkle on top-right -->
  <path d="M440 90 L445 105 L460 110 L445 115 L440 130 L435 115 L420 110 L435 105 Z" fill="#ffffff" filter="url(#glow)" />
</svg>
